name: Android Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Leer versión de Flutter
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Preparar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      - name: Instalar componentes Android
        # El runner oficial ubuntu-24.04 ya incluye SDK y command-line tools.
        run: |
          SDK_MANAGER=$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'

      - name: Comprobar versiones
        run: |
          flutter --version
          java -version

      - name: Resolver dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analizar código
        run: flutter analyze --fatal-infos

      - name: Ejecutar pruebas
        run: flutter test --coverage

      - name: Compilar APK de depuración
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/regina-build.log"

      - name: Anotar fallo de compilación
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'regina-build.log'
          if log.exists():
              tail = '\n'.join(log.read_text(errors='replace').splitlines()[-100:])
              message = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Diagnóstico Android::{message}')
          PY

      - name: Preparar descarga
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/las-aventuras-de-regina-debug.apk
          cd dist
          sha256sum las-aventuras-de-regina-debug.apk > SHA256SUMS.txt

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: regina-android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: regina-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Resumen de diagnóstico
        if: always()
        run: |
          {
            echo '### Formato y dependencias'
            if command -v dart >/dev/null 2>&1; then
              dart format lib test
              echo '```diff'
              git diff -- lib test
              echo '```'
              python3 - <<'PY'
          import subprocess
          import sys
          diff = subprocess.check_output(['git', 'diff', '--', 'lib', 'test'], text=True)
          if diff:
              message = diff.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Formato sugerido::{message}', file=sys.stderr)
          PY
            fi
            if test -f pubspec.lock; then
              echo '<details><summary>Dependencias resueltas (pubspec.lock)</summary>'
              echo
              echo '```yaml'
              cat pubspec.lock
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
